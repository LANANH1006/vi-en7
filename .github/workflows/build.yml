name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tìm và giải nén source
        id: prep
        run: |
          set -e
          mkdir -p extracted
          find . -name "*.zip" -not -path "./.git/*" -not -path "./extracted/*" -print0 | while IFS= read -r -d '' z; do
            echo "Giải nén: $z"
            unzip -q -o "$z" -d extracted
          done
          PROJECT_FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Không tìm thấy settings.gradle. Nội dung repo:"
            find . -maxdepth 3 -not -path "./.git*"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Project nằm tại: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build with Gradle
        working-directory: ${{ steps.prep.outputs.project_dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vi-recipe-helper
          path: ${{ steps.prep.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
